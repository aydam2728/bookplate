name: CI

on:
  push:
    branches: [main]
  # pull_request, never pull_request_target: a fork's code must not run with
  # access to this repository's secrets.
  pull_request:
  # So a maintainer can prove the pipeline works without opening a pull
  # request first.
  workflow_dispatch:

# Least privilege by default. A job raises only what it needs, on itself.
permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo and a C toolchain, which the Linux runner
      # has and a Windows contributor's machine may not. This is the one check
      # that genuinely belongs in CI rather than in `make check`.
      - name: Test with the race detector
        run: go test -race ./...

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both architectures are first-class. One failing must not hide the
      # other's result.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Each runner builds for its own architecture, so arm64 is built and
      # exercised natively rather than under emulation.
      - name: Build
        run: docker build -t bookplate:smoke --build-arg VERSION=ci .

      - name: Smoke test
        run: ./scripts/smoke-test.sh bookplate:smoke

      - name: Report the image size
        run: |
          bytes=$(docker image inspect bookplate:smoke --format '{{.Size}}')
          echo "Image size: $((bytes / 1024 / 1024)) MB (budget: 150 MB)"
          if [ "$bytes" -gt 157286400 ]; then
            echo "The image is over the 150 MB budget."
            exit 1
          fi

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Pinned, like every other tool this repository executes. It also covers
      # the standard library, which matters most while there are no
      # dependencies at all.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
